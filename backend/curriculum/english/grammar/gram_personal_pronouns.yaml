grammar_id: gram_personal_pronouns
display_code: G002
title: Personal pronouns
cefr_level: A1
order: 20
prerequisites:
- gram_be_present
unlock_targets: []
grammar_targets:
- I
- you
- he
- she
- it
- we
- they
teaching_notes: Keep forms short and high-frequency. Model the target in introducing people, pointing
  to objects; check comprehension before guided production, then recycle it in a new context.
common_mistakes:
- Him is my friend.
- She name is Sara.
examples:
- He is my brother.
- We are friends.
- It is a book.
learning_objectives:
- Use subject pronouns correctly
- Match pronouns to be and simple verbs
