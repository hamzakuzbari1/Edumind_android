[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
addopts = -ra --strict-config --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 120
markers =
    integration: exercises the assembled ASGI application rather than a helper in isolation
    postgresql: requires the dedicated PostgreSQL test service
    concurrency: exercises behavior across real concurrent PostgreSQL transactions
