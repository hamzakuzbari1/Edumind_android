<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#080c18;font-family:'Cairo','Tajawal',Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#080c18;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#0f1629;border-radius:16px;border:1px solid rgba(124,108,240,0.25);overflow:hidden;">
          <tr>
            <td style="padding:28px 32px 16px;text-align:center;background:linear-gradient(135deg,#7c6cf0 0%,#5b4fcf 40%,#22d3ee 100%);">
              <div style="font-size:26px;font-weight:700;color:#ffffff;letter-spacing:0.5px;">EduSpark</div>
              <div style="font-size:13px;color:rgba(255,255,255,0.85);margin-top:4px;">تعلّم بذكاء</div>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;color:#e8ecf4;font-size:15px;line-height:1.7;">
              {{content}}
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 28px;color:rgba(232,236,244,0.55);font-size:12px;line-height:1.6;text-align:center;">
              © {{year}} EduSpark — منصة تعليم ذكية<br />
              إذا لم تطلب هذا البريد، يمكنك تجاهله بأمان.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
